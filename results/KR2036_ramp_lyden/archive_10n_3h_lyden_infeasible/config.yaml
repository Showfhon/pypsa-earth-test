clustering:
  simplify_network:
    to_substations: false
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
    remove_stubs: true
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 20
    p_threshold_merge_isolated: 300
    # >>> KR 論文設 0.05（新版 default 是 false）。
    #     韓國有離島/孤立子網路，設 false 會產生完全沒有 AC 線路的節點，
    #     造成該節點負載全部被 curtail/load-shed。這裡跟回論文設定。
    s_threshold_fetch_isolated: 0.05
  cluster_network:
    algorithm: kmeans
    feature: solar+onwind-time
    exclude_carriers: []
  alternative_clustering: false   # >>> KR 論文用 Voronoi（false），非 GADM
  distribute_cluster: ["load"]
  out_logging: true
  aggregation_strategies:
    generators:
      p_nom: sum
      p_nom_max: sum
      p_nom_min: sum
      p_min_pu: mean
      p_max_pu: weighted_average
      marginal_cost: mean
      committable: any
      ramp_limit_up: max
      ramp_limit_down: max
      efficiency: mean
      build_year: mean
      lifetime: mean
    one_ports:
      StorageUnit:
        build_year: mean
        lifetime: mean
  focus_weights: false

osm:
  clean_osm_data:
    names_by_shapes: true
    threshold_voltage: 51000
    tag_substation: "transmission"
    add_line_endings: true
    generator_name_method: OSM
    use_custom_lines: "OSM_only"
    path_custom_lines: false
    use_custom_substations: "OSM_only"
    path_custom_substations: false
    use_custom_cables: "OSM_only"
    path_custom_cables: false

  build_osm_network:
    group_close_buses: true
    group_tolerance_buses: 5000
    split_overpassing_lines: true
    overpassing_lines_tolerance: 1
    force_ac: false             # >>> KR 保持 false，濟州 HVDC 才會被建成 Link

